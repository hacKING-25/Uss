<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:,">
<title>Duo chat</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('duo-theme');
    var theme = saved === 'light' || saved === 'dark'
      ? saved
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --app-bg: #161b22;
    --border: #232b36;
    --border-strong: #303a47;
    --text: #e6edf3;
    --muted: #8b98a5;
    --btn-bg: #1d2430;
    --btn-hover: #253040;
    --bubble-them: #222a35;
    --bubble-me: #1f4fd8;
    --bubble-me-text: #fff;
    --input-bg: #0e1116;
    --system-bg: #1b222c;
    --emojis-bg: #131820;
    --notice-text: #d29922;
    --notice-bg: #2a2113;
    --notice-border: #3a2f18;
    --accent: #3b6cf0;
    --delivered: #7ee787;
    --online: #3fb950;
    --waiting: #d29922;
    --danger: #f85149;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f5;
    --app-bg: #ffffff;
    --border: #e2e6ec;
    --border-strong: #d3d9e1;
    --text: #1c2128;
    --muted: #667085;
    --btn-bg: #f1f3f6;
    --btn-hover: #e6eaf0;
    --bubble-them: #eef1f5;
    --bubble-me: #1f4fd8;
    --bubble-me-text: #fff;
    --input-bg: #ffffff;
    --system-bg: #f1f3f6;
    --emojis-bg: #fafbfc;
    --notice-text: #8a5a00;
    --notice-bg: #fff7e0;
    --notice-border: #f2e2b6;
    --accent: #1f4fd8;
    --delivered: #1a7f37;
    --online: #1a7f37;
    --waiting: #9a6700;
    --danger: #cf222e;
  }
  body {
    margin: 0;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button, input { font: inherit; }
  .app {
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--app-bg);
    border-inline: 1px solid var(--border);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .peer { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .peer strong { display: block; font-size: 15px; }
  .peer small {
    display: block;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.online { background: var(--online); box-shadow: 0 0 0 3px rgba(63, 185, 80, .18); }
  .dot.waiting { background: var(--waiting); }
  .dot.connecting { background: var(--muted); animation: pulse 1s infinite alternate; }
  .dot.offline, .dot.full { background: var(--danger); }
  @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
  .actions { display: flex; align-items: center; gap: 8px; flex: none; }
  #invite {
    border: 1px solid var(--border-strong);
    background: var(--btn-bg);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  #invite:hover { background: var(--btn-hover); }
  #themeBtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--border-strong);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: 9px;
    cursor: pointer;
  }
  #themeBtn:hover { background: var(--btn-hover); }
  #themeBtn svg { width: 18px; height: 18px; }
  #themeBtn .icon-sun { display: none; }
  #themeBtn .icon-moon { display: block; }
  [data-theme="dark"] #themeBtn .icon-sun { display: block; }
  [data-theme="dark"] #themeBtn .icon-moon { display: none; }
  .notice {
    padding: 7px 14px;
    font-size: 12px;
    color: var(--notice-text);
    background: var(--notice-bg);
    border-bottom: 1px solid var(--notice-border);
  }
  .notice[hidden] { display: none; }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
  }
  .system {
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    background: var(--system-bg);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    margin: 4px 0;
    text-align: center;
  }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 7px 11px 8px;
    border-radius: 14px;
    background: var(--bubble-them);
    overflow-wrap: anywhere;
  }
  .row.me .bubble {
    background: var(--bubble-me);
    color: var(--bubble-me-text);
    border-bottom-right-radius: 4px;
  }
  .row.them .bubble { border-bottom-left-radius: 4px; }
  .text { white-space: pre-wrap; }
  .meta { margin-left: 8px; font-size: 11px; opacity: .65; white-space: nowrap; }
  .status { margin-left: 5px; font-size: 11px; white-space: nowrap; }
  .status.queued { opacity: .6; }
  .status.sent { opacity: .75; }
  .status.delivered { color: var(--delivered); opacity: 1; }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  #emojiBtn, #voiceBtn, #send {
    border: 1px solid var(--border-strong);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: 10px;
    padding: 0 12px;
    height: 42px;
    cursor: pointer;
  }
  #emojiBtn { font-size: 19px; }
  #voiceBtn { font-size: 18px; }
  #voiceBtn.recording { background: var(--danger); border-color: var(--danger); color: #fff; }
  #send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #input {
    flex: 1;
    min-width: 0;
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--input-bg);
    color: var(--text);
    padding: 0 12px;
    outline: none;
    font-size: 16px;
  }
  #input:focus { border-color: var(--accent); }
  .emojis {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 2px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    max-height: 160px;
    overflow-y: auto;
    background: var(--emojis-bg);
  }
  .emojis button {
    border: 0;
    background: transparent;
    font-size: 21px;
    padding: 5px;
    cursor: pointer;
    border-radius: 8px;
  }
  .emojis button:hover { background: var(--bubble-them); }
  .emojis[hidden] { display: none; }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="peer">
      <span id="dot" class="dot connecting"></span>
      <div>
        <strong>Duo chat</strong>
        <small id="peerStatus">Connecting…</small>
      </div>
    </div>
    <div class="actions">
      <button id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="invite" type="button">Invite</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div id="log" class="log" aria-live="polite"></div>

  <div id="emojis" class="emojis" hidden></div>

  <form id="composer" autocomplete="off">
    <button id="emojiBtn" type="button" aria-label="Insert emoji">🙂</button>
    <button id="voiceBtn" type="button" aria-label="Record voice message">🎤</button>
    <input id="input" placeholder="Message…" maxlength="2000" aria-label="Message">
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  let room = (params.get('room') || '').trim().slice(0, 64);
  if (!room) {
    room = Math.random().toString(36).slice(2, 8);
    params.set('room', room);
    history.replaceState(null, '', `${location.pathname}?${params}${location.hash}`);
  }
  const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?room=${encodeURIComponent(room)}`;

  const logEl = document.getElementById('log');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const dot = document.getElementById('dot');
  const peerStatus = document.getElementById('peerStatus');
  const emojiBtn = document.getElementById('emojiBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const emojiPanel = document.getElementById('emojis');
  const inviteBtn = document.getElementById('invite');
  const notice = document.getElementById('notice');
  const themeBtn = document.getElementById('themeBtn');

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    themeBtn.setAttribute('aria-label', label);
    themeBtn.title = label;
  }

  applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('duo-theme', next); } catch {}
  });

  const EMOJIS = [
    '😀', '😂', '😊', '😍', '😘', '😎', '🤔', '😅', '😢', '😭', '😡', '🥳',
    '👍', '👎', '👏', '🙏', '💪', '🔥', '❤️', '💔', '🎉', '✨', '💯', '✅',
    '❌', '☕', '🍕', '🌙', '☀️', '🙈', '🤝', '👋', '😴', '🤯', '🥲', '😇'
  ];

  let ws = null;
  let reconnectTimer = null;
  let peerOnline = false;
  const pending = new Map();
  const outbox = [];

  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function scrollDown() {
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(state) {
    dot.className = 'dot ' + state;
    peerStatus.textContent = {
      connecting: 'Connecting…',
      online: 'Peer online',
      waiting: 'Waiting for the other person…',
      offline: 'Disconnected — reconnecting…',
      full: 'Room is full (2 people max)…',
    }[state] || state;
  }

  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'system';
    el.textContent = text;
    logEl.appendChild(el);
    scrollDown();
  }

  function addMessage(text, ts, mine, id) {
    const row = document.createElement('div');
    row.className = 'row ' + (mine ? 'me' : 'them');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const body = document.createElement('span');
    body.className = 'text';
    body.textContent = text;

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = fmtTime(ts);

    bubble.append(body, meta);

    if (mine) {
      const status = document.createElement('span');
      status.className = 'status queued';
      status.textContent = '🕘';
      status.title = 'Queued';
      bubble.appendChild(status);
      if (id) pending.set(id, status);
    }

    row.appendChild(bubble);
    logEl.appendChild(row);
    scrollDown();
  }

  function addVoiceMessage(audio, ts, mine, id) {
    const row = document.createElement('div');
    row.className = 'row ' + (mine ? 'me' : 'them');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const player = document.createElement('audio');
    player.controls = true;
    player.src = audio;
    player.preload = 'metadata';

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = fmtTime(ts);

    bubble.append(player, meta);

    if (mine) {
      const status = document.createElement('span');
      status.className = 'status queued';
      status.textContent = '🕘';
      status.title = 'Queued';
      bubble.appendChild(status);
      if (id) pending.set(id, status);
    }

    row.appendChild(bubble);
    logEl.appendChild(row);
    scrollDown();
  }

  function ack(ids) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'ack', ids: Array.isArray(ids) ? ids : [ids] }));
  }

  function onMessage(ev) {
    let m;
    try {
      m = JSON.parse(ev.data);
    } catch {
      return;
    }

    switch (m.type) {
      case 'welcome':
        peerOnline = Boolean(m.peerOnline);
        setStatus(peerOnline ? 'online' : 'waiting');
        break;
      case 'peer':
        peerOnline = Boolean(m.online);
        setStatus(peerOnline ? 'online' : 'waiting');
        addSystem(peerOnline ? 'Peer joined' : 'Peer left');
        break;
      case 'sent': {
        const s = pending.get(m.id);
        if (s) {
          s.textContent = '✓';
          s.className = 'status sent';
          s.title = 'Sent';
        }
        break;
      }
      case 'delivered':
        for (const id of m.ids) {
          const s = pending.get(id);
          if (s) {
            s.textContent = '✓✓';
            s.className = 'status delivered';
            s.title = 'Delivered';
            pending.delete(id);
          }
        }
        break;
      case 'msg':
        addMessage(m.text, m.ts || Date.now(), false);
        ack(m.id);
        break;
      case 'voice':
        addVoiceMessage(m.audio, m.ts || Date.now(), false);
        ack(m.id);
        break;
      case 'full':
        setStatus('full');
        break;
    }
  }

  function flush() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    while (outbox.length) {
      const item = outbox[0];
      try {
        if (item.kind === 'voice') {
          ws.send(JSON.stringify({ type: 'voice', id: item.id, audio: item.audio }));
        } else {
          ws.send(JSON.stringify({ type: 'msg', id: item.id, text: item.text }));
        }
      } catch {
        return;
      }
      outbox.shift();
    }
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    setStatus('connecting');
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      flush();
      setStatus(peerOnline ? 'online' : 'waiting');
    };
    ws.onmessage = onMessage;
    ws.onerror = () => {
      try { ws.close(); } catch {}
    };
    ws.onclose = (ev) => {
      ws = null;
      peerOnline = false;
      if (ev.code === 4000) {
        setStatus('full');
        reconnectTimer = setTimeout(connect, 5000);
      } else {
        setStatus('offline');
        reconnectTimer = setTimeout(connect, 1500);
      }
    };
  }

  function send(text) {
    text = text.trim();
    if (!text) return;

    const id = typeof crypto.randomUUID === 'function'
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);

    addMessage(text, Date.now(), true, id);
    outbox.push({ id, kind: 'text', text });
    flush();
  }

  let mediaRecorder = null;
  let recordingChunks = [];
  let isRecording = false;

  async function toggleVoice() {
    if (isRecording && mediaRecorder) {
      mediaRecorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      recordingChunks = [];
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recordingChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        isRecording = false;
        voiceBtn.classList.remove('recording');
        voiceBtn.textContent = '🎤';
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(recordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        if (!blob.size) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          const dataUrl = reader.result;
          const id = typeof crypto.randomUUID === 'function'
            ? crypto.randomUUID()
            : Date.now().toString(36) + Math.random().toString(36).slice(2);
          addVoiceMessage(dataUrl, Date.now(), true, id);
          outbox.push({ id, kind: 'voice', audio: dataUrl });
          flush();
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      isRecording = true;
      voiceBtn.classList.add('recording');
      voiceBtn.textContent = '⏹';
    } catch (e) {
      addSystem('Microphone access denied or unavailable');
    }
  }

  voiceBtn.addEventListener('click', toggleVoice);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    send(input.value);
    input.value = '';
    input.focus();
  });

  const insertEmoji = (emoji) => {
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? start;
    input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
    const pos = start + emoji.length;
    input.setSelectionRange(pos, pos);
    input.focus();
  };

  for (const emoji of EMOJIS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = emoji;
    btn.addEventListener('click', () => insertEmoji(emoji));
    emojiPanel.appendChild(btn);
  }

  emojiBtn.addEventListener('click', () => {
    emojiPanel.hidden = !emojiPanel.hidden;
  });

  document.addEventListener('click', (e) => {
    if (!emojiPanel.hidden && !emojiPanel.contains(e.target) && e.target !== emojiBtn) {
      emojiPanel.hidden = true;
    }
  });

  inviteBtn.addEventListener('click', async () => {
    const link = location.href;
    try {
      await navigator.clipboard.writeText(link);
      inviteBtn.textContent = 'Copied!';
    } catch {
      prompt('Copy this invite link:', link);
      inviteBtn.textContent = 'Copied!';
    }
    setTimeout(() => { inviteBtn.textContent = 'Invite'; }, 1200);
  });

  const host = location.hostname;
  const isLocalhost = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
  const isPrivate =
    /^10\./.test(host) ||
    /^192\.168\./.test(host) ||
    /^172\.(1[6-9]|2\d|3[01])\./.test(host) ||
    host.endsWith('.local');

  if (isLocalhost) {
    notice.textContent =
      'This link only works on this computer. Deploy to a public URL (README → Render) to invite someone.';
    notice.hidden = false;
  } else if (isPrivate) {
    notice.textContent =
      'This link only works on your local network. Deploy to a public URL (README → Render) to invite someone outside it.';
    notice.hidden = false;
  }

  addSystem(`Room “${room}” — share the invite link to start.`);
  connect();
})();
</script>
</body>
</html>
